[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kwork-pa"
version = "0.1.0"
description = "Поиск заказов на Kwork и клиентов в 2ГИС, с которыми справится Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests[socks]>=2.31",
    "beautifulsoup4>=4.12",
    "anthropic>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kwork-pa = "kwork_pa.cli:main"

[tool.setuptools]
packages = ["kwork_pa"]
